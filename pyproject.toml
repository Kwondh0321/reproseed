[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "reproseed"
version = "0.1.0"
description = "Automated reproducibility checks for research repositories and Jupyter notebooks"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ReproSeed contributors" }]
keywords = ["reproducibility", "jupyter", "research", "open-science"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
web = [
  "fastapi==0.115.12",
  "python-multipart==0.0.20",
  "uvicorn==0.34.2",
]
dev = [
  "pytest==8.3.5",
  "httpx==0.28.1",
]

[project.scripts]
reproseed = "reproseed.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reproseed = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

